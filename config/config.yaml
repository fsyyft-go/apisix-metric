# 服务器配置。
server:
  # 服务器监听端口，默认为 32780。
  port: 32780

# 日志配置
log:
  # 日志类型，可选值：console, std, logrus，默认为 console
  type: logrus
  # 日志输出路径，默认输出到控制台
  output: "logs/apisix-metric.log"

# Prometheus 监控配置。
prometheus:
  # Prometheus 指标暴露路径，默认为 /metrics。
  path: /metrics

# 代理配置。
proxy:
  local:
    # 本地代理路径配置。
    path: /apisix/prometheus/metrics

